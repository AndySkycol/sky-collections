<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista móvil · Sky Collections</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101c2c;font-family:Arial,sans-serif;padding:24px}
    .phone{width:min(100%,390px);height:min(844px,calc(100vh - 48px));background:#fff;border:10px solid #091521;border-radius:34px;overflow:hidden;box-shadow:0 22px 70px #0009}
    iframe{width:100%;height:100%;border:0;display:block}
    @media(max-width:480px){body{padding:0}.phone{width:100%;height:100vh;border:0;border-radius:0}}
  </style>
</head>
<body>
  <div class="phone"><iframe id="mobile-site" title="Sky Collections en móvil" src="/"></iframe></div>
  <script>
    if (new URLSearchParams(location.search).get('no-promo') === '1') {
      document.querySelector('#mobile-site').src = '/?preview=no-promo';
    }
  </script>
</body>
</html>
